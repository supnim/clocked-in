services:
  postgres:
    image: postgres:18-alpine
    container_name: clockedin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clockedin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clockedin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-clockedin}
    volumes:
      # postgres 18+ images store data in a pg_ctlcluster-compatible layout and
      # refuse to start against a volume mounted at the legacy .../data path —
      # mount the parent dir instead (see docker-library/postgres#1259).
      - postgres_data:/var/lib/postgresql
      # Schema is created/upgraded by scripts/migrate.py when the api starts
      # (MIGRATE_ON_START=true). Existing volumes created from init.sql are
      # adopted automatically.
    ports:
      # Dev only, loopback only. Host port 55432 avoids clashing with a local
      # Postgres on 5432; in-network traffic (api -> postgres) uses 5432.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clockedin} -d ${POSTGRES_DB:-clockedin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clockedin-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clockedin-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MIGRATE_ON_START: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-clockedin}:${POSTGRES_PASSWORD:-clockedin_dev}@postgres:5432/${POSTGRES_DB:-clockedin}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
