# Self-hosted production stack (alternative to Fly.io, see DEPLOY.md).
# Only the API port is published, bound to loopback: put a TLS-terminating
# reverse proxy (Caddy / nginx) in front and set TRUST_PROXY=true.
#
#   cp .env.example .env   # then set JWT_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clockedin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clockedin}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clockedin} -d ${POSTGRES_DB:-clockedin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes)}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-720}
      DATABASE_URL: postgresql://${POSTGRES_USER:-clockedin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clockedin}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUST_PROXY: "true"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      MIGRATE_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
